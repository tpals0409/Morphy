name: Windows build and verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Windows package version
        default: '0.1.0'
        required: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker download routes
        run: node --test src/index.test.mjs
      - name: Build and self-test
        shell: pwsh
        run: ./build-windows.ps1 -SelfTest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Office and Korean document verification
        shell: pwsh
        run: |
          python -m pip install python-docx openpyxl python-pptx pypdf
          ./scripts/test-windows-office.ps1
      - name: Package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version || '0.1.0' }}
        run: ./scripts/package-windows.ps1 -Version $env:PACKAGE_VERSION
      - name: Installer self-test
        shell: pwsh
        run: |
          $setup = Get-ChildItem build/windows-release/Morphy-*-win-x64-Setup.exe | Select-Object -First 1
          $env:MORPHY_ENGINE_PATH = (Resolve-Path .tools/lo-extracted/LibreOffice/program/soffice.com).Path
          $test = Start-Process $setup.FullName -ArgumentList '--selftest' -PassThru -Wait -WindowStyle Hidden
          if ($test.ExitCode -ne 0) { throw 'Installer self-test failed' }
      - name: Corresponding codec sources
        shell: pwsh
        run: ./scripts/package-codec-sources.ps1
      - name: Verify website release bundle
        run: python scripts/publish-release.py --artifact build/windows-release
      - uses: actions/upload-artifact@v4
        with:
          name: Morphy-Windows-${{ inputs.version || '0.1.0' }}-${{ github.sha }}
          retention-days: 30
          compression-level: 0
          path: |
            build/windows-release/Morphy-*-win-x64-Setup.exe
            build/windows-release/SHA256SUMS.txt
            build/windows-release/windows-release.json
            build/windows-release/WicHeic-*-corresponding-source.zip
            build/windows-release/setup-selftest.txt
            build/windows-integration/report.json
          if-no-files-found: error
